  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter · Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Tipografía global ── */
    *, *::before, *::after { font-family: 'Inter', sans-serif; }

    /* ── Scrollbar sidebar ── */
    .sidebar-scroll::-webkit-scrollbar          { width: 3px; }
    .sidebar-scroll::-webkit-scrollbar-track    { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb    { background: #334155; border-radius: 2px; }

    /* ── Scrollbar contenido principal ── */
    .main-scroll::-webkit-scrollbar             { width: 6px; }
    .main-scroll::-webkit-scrollbar-track       { background: #f1f5f9; }
    .main-scroll::-webkit-scrollbar-thumb       { background: #cbd5e1; border-radius: 3px; }

    /* ── Drawer ── */
    .drawer-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-panel {
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drawer-panel.open {
      transform: translateX(0);
    }
  </style>
</head>

<!-- ════════════════════════════════════════
     JAVASCRIPT — Fase 1: Navegación
════════════════════════════════════════ -->
<script>

// ── Metadatos por sección ──────────────────────────────────────────────────
const SECTION_META = {
  dashboard:     { title: 'Resumen del ecosistema',  crumb: 'Resumen' },
  dominios:      { title: 'Gestión de dominios',     crumb: 'Dominios' },
  webs:          { title: 'Sitios Web WordPress',    crumb: 'Sitios Web' },
  mantenimiento: { title: 'Mantenimiento técnico',   crumb: 'Mantenimiento' },
  alertas:       { title: 'Pendientes y alertas',    crumb: 'Pendientes' },
};

// ── Navegación principal ───────────────────────────────────────────────────
function navigate(section) {
  // 1. Actualizar header
  const meta = SECTION_META[section] || SECTION_META.dashboard;
  document.getElementById('section-title').textContent    = meta.title;
  document.getElementById('breadcrumb-section').textContent = meta.crumb;

  // 2. Resaltar nav item activo
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const isActive = btn.dataset.section === section;
    btn.classList.toggle('bg-slate-800', isActive);
    btn.classList.toggle('text-white',   isActive);
    btn.classList.toggle('text-slate-400', !isActive);
  });

  // 3. Renderizar contenido de la sección
  document.getElementById('content').innerHTML = renderSection(section);
}

// ── Placeholder genérico ───────────────────────────────────────────────────
function renderPlaceholder(label) {
  return `
    <div class="flex flex-col items-center justify-center h-64 text-slate-400 select-none">
      <svg class="w-10 h-10 mb-3 opacity-25" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0
             01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2
             2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
      <p class="text-sm font-medium">${label}</p>
      <p class="text-xs mt-1 text-slate-300">En construcción · próxima fase</p>
    </div>`;
}

// ── Despachador de secciones ───────────────────────────────────────────────
function renderSection(section) {
  switch (section) {
    case 'dashboard':     return renderPlaceholder('Resumen');
    case 'dominios':      return renderPlaceholder('Dominios');
    case 'webs':          return renderPlaceholder('Sitios Web');
    case 'mantenimiento': return renderPlaceholder('Mantenimiento');
    case 'alertas':       return renderPlaceholder('Pendientes / Alertas');
    default:              return renderPlaceholder('Sección');
  }
}

// ── Inicialización ─────────────────────────────────────────────────────────
function init() {
  // Asignar listeners a los botones de navegación
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.section));
  });

  // Badge placeholder hasta que existan datos (Fase 2)
  document.getElementById('badge-alertas').textContent = '·';

  // Sección inicial
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);
</script>
