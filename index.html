const SECTION_META = {
  dashboard:     { title: 'Resumen del ecosistema',  crumb: 'Resumen' },

  webs:          { title: 'Sitios Web WordPress',    crumb: 'Sitios Web' },

// ── Navegación principal ───────────────────────────────────────────────────
function navigate(section) {
  // 1. Actualizar header
  const meta = SECTION_META[section] || SECTION_META.dashboard;
  document.getElementById('section-title').textContent    = meta.title;
  document.getElementById('breadcrumb-section').textContent = meta.crumb;

  // 2. Resaltar nav item activo
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const isActive = btn.dataset.section === section;
    btn.classList.toggle('bg-slate-800', isActive);
    btn.classList.toggle('text-white',   isActive);
    btn.classList.toggle('text-slate-400', !isActive);
  });

  // 3. Renderizar contenido de la sección
  document.getElementById('content').innerHTML = renderSection(section);

  // 4. Poblar sub-tablas tras montar el HTML
  if (section === 'dominios') {
    const el = document.getElementById('dominios-tbody');
    if (el) el.innerHTML = renderTablaDominios();
  }
  if (section === 'webs') {
    const el = document.getElementById('webs-tbody');
    if (el) el.innerHTML = renderTablaWebs();
  }
}

// Genera el resumen conversacional dinámicamente desde appData
function generarResumenIA() {
  const dm  = appData.dominios.filter(d => d.estado === 'migrado').length;
  const dp  = appData.dominios.filter(d => d.estado === 'pendiente').length;
  const wm  = appData.webs.filter(w => w.migracion === 'migrado').length;
  const wf  = appData.webs.filter(w => w.migracion === 'migrado' && w.facturacion === 'facturado').length;
  const wpf = appData.webs.filter(w => w.migracion === 'migrado' && w.facturacion === 'pendiente').length;
  const wp  = appData.webs.filter(w => w.migracion === 'pendiente').length;
  const mb  = appData.mantenimiento.filter(m => m.estado === 'bloqueado').length;
  const crit = appData.pendientes.filter(p => p.prioridad === 'critico').length;
  const fact = appData.pendientes.filter(p => p.prioridad === 'facturacion').length;
  const sitiosEdSchool = ['buenconsejoicod.com', 'buenconsejolalaguna.com', 'colegiobuenconsejo.es'];

  const parrafos = [];

  // Estado general
  parrafos.push(
    `El ecosistema digital de <strong>Franciscanas del Buen Consejo</strong> cuenta con
     <strong>${appData.dominios.length} dominios</strong> y
     <strong>${appData.webs.length} sitios WordPress</strong> bajo gestión.
     La migración principal está muy avanzada: <strong>${dm} de ${appData.dominios.length} dominios</strong>
     han sido trasladados correctamente a Hostinger, y
     <strong>${wm} de ${appData.webs.length} sitios web</strong> están ya en el nuevo entorno.`
  );

  // Facturación
  if (wpf > 0) {
    parrafos.push(
      `En facturación, <strong>${wf} sitio${wf !== 1 ? 's' : ''}</strong> están completamente cerrado${wf !== 1 ? 's' : ''},
       pero <strong>${wpf} migración${wpf !== 1 ? 'es' : ''}</strong>
       ${wpf !== 1 ? 'tienen' : 'tiene'} facturación pendiente de emitir:
       ${appData.webs.filter(w => w.migracion === 'migrado' && w.facturacion === 'pendiente')
         .map(w => `<span class="font-mono text-xs bg-slate-100 px-1 rounded">${w.url ? w.url.replace(/^https?:\/\//,'') : w.nombre}</span>`)
         .join(', ')}.`
    );
  }

  // Alertas críticas — theme
  if (crit > 0) {
    parrafos.push(
      `<span class="text-red-700 font-semibold">⚠ Atención crítica:</span>
       el theme <strong>Ed School</strong> ha sido descatalogado por su desarrollador y ya no recibe
       actualizaciones de seguridad. Afecta a
       ${sitiosEdSchool.map(s => `<span class="font-mono text-xs bg-red-50 text-red-700 px-1 rounded border border-red-200">${s}</span>`).join(', ')}.
       Se recomienda planificar la migración de theme con prioridad alta.`
    );
  }

  // Mantenimiento bloqueado
  if (mb > 0) {
    const bloq = appData.mantenimiento.filter(m => m.estado === 'bloqueado');
    parrafos.push(
      `El mantenimiento de <strong>${bloq.map(b => b.sitio).join(', ')}</strong>
       está actualmente <span class="text-red-600 font-semibold">bloqueado</span>.
       Las tareas están detenidas en coordinación con Hostinger para resolver la incidencia.`
    );
  }

  // Pendientes externos (Perú + Integra)
  const externos = appData.pendientes.filter(p => p.prioridad === 'gestion' || p.prioridad === 'comunicacion');
  if (externos.length > 0) {
    parrafos.push(
      `Hay <strong>${externos.length} entidad${externos.length !== 1 ? 'es' : ''}</strong> con gestión externa pendiente:
       dominios de <strong>Integra Información y Comunicación S.L.</strong> (buen-consejo.com, www2.buen-consejo.com)
       y sitios en <strong>Perú</strong> (madreteresarodon.edu.pe, buenconsejo.edu.pe)
       a la espera de comunicación con los responsables locales.`
    );
  }

  // Cierre positivo
  parrafos.push(
    `En conjunto, <strong>${appData.mantenimiento.filter(m => m.estado === 'actualizado').length} informes
     de mantenimiento</strong> están al día. El ecosistema opera con normalidad
     en todos los sitios migrados, con foco de acción en la resolución del stack técnico
     y el cierre de las ${fact} facturación${fact !== 1 ? 'es' : ''} pendiente${fact !== 1 ? 's' : ''}.`
  );

  return parrafos;
}

  const btn = document.getElementById('btn-ia');
  if (!btn) return;
  const estados = {
    idle: {
      html:     `${ICON_SPARKLES} Resumen de estado IA`,
      disabled: false,
      cls:      'bg-white border-slate-200 text-slate-700 hover:border-blue-300 hover:text-blue-700 hover:bg-blue-50',
    },
    loading: {
      html:     `${ICON_SPINNER} Generando…`,
      disabled: true,
      cls:      'bg-white border-slate-200 text-slate-400 cursor-not-allowed',
    },
    done: {
      html:     `${ICON_REFRESH} Regenerar`,
      disabled: false,
      cls:      'bg-white border-slate-200 text-slate-500 hover:border-slate-300 hover:bg-slate-50',
    },
  };
  const cfg = estados[estado];
  btn.innerHTML  = cfg.html;
  btn.disabled   = cfg.disabled;
  // Quitar clases de color anteriores y aplicar las nuevas
  btn.className  = `inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium
                    border shadow-sm transition-all ${cfg.cls}`;
}

// ── Paso 2 · Mostrar / ocultar contenido ────────────────────────────────
// (el efecto typewriter se añadirá en Paso 3 dentro de mostrarContenidoIA)
function iniciarResumenIA() {
  const body   = document.getElementById('ia-body');
  const puntos = document.getElementById('ia-puntos');
  if (!body) return;

  // Si ya estaba visible → resetear (modo Regenerar)
  if (!body.classList.contains('hidden')) {
    body.classList.add('hidden');
    puntos.classList.add('hidden');
    setBtnEstado('idle');
    return;
  }

  // Estado: cargando
  setBtnEstado('loading');

  // Pequeña pausa visual antes de mostrar (se sustituirá por typewriter en Paso 3)
  setTimeout(() => {
    body.classList.remove('hidden');
    puntos.classList.remove('hidden');
    setBtnEstado('done');
  }, 600);
}

function renderDominios() {
  return `
    <div class="max-w-6xl mx-auto space-y-5">

      <!-- Toolbar: filtros + buscador -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">

        <!-- Filter tabs -->
        <div class="flex items-center gap-1.5">
          ${tabFiltro('dominiosFilter', 'todos',     'Todos',      appData.dominios.length)}
          ${tabFiltro('dominiosFilter', 'migrado',   'Migrados',   appData.dominios.filter(d => d.estado === 'migrado').length)}
          ${tabFiltro('dominiosFilter', 'pendiente', 'Pendientes', appData.dominios.filter(d => d.estado === 'pendiente').length)}
        </div>

        <!-- Buscador -->
        <div class="relative">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            id="input-dominios"
            type="search"
            placeholder="Buscar dominio…"
            value="${state.dominiosBusqueda}"
            oninput="onBuscarDominios(this.value)"
            class="pl-9 pr-4 py-2 text-sm rounded-lg border border-slate-200 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400
                   w-60 transition-shadow placeholder-slate-400"
          />
        </div>
      </div>

      <!-- Tabla -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div id="dominios-tbody"></div>
      </div>

    </div>`;
}

// Renderiza (o re-renderiza) solo la tabla interior
function renderTablaDominios() {
  let rows = appData.dominios;

  if (state.dominiosFilter !== 'todos') {
    rows = rows.filter(d => d.estado === state.dominiosFilter);
  }
  if (state.dominiosBusqueda.trim()) {
    const q = state.dominiosBusqueda.toLowerCase();
    rows = rows.filter(d =>
      d.nombre.toLowerCase().includes(q) ||
      d.proveedor.toLowerCase().includes(q)
    );
  }

  if (!rows.length) {
    return `<div class="px-6 py-14 text-center text-sm text-slate-400">
              Sin resultados para los filtros aplicados.
            </div>`;
  }

  return `
    <table class="w-full">
      <thead>
        <tr class="border-b border-slate-100 bg-slate-50/80">
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Dominio</th>
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider hidden md:table-cell">Proveedor</th>
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Estado</th>
          <th class="text-right px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        ${rows.map(d => `
          <tr class="hover:bg-slate-50/80 transition-colors group">
            <td class="px-6 py-3.5">
              <span class="text-sm font-mono font-medium text-slate-800 group-hover:text-blue-700 transition-colors">
                ${d.nombre}
              </span>
            </td>
            <td class="px-6 py-3.5 hidden md:table-cell">
              <span class="text-sm text-slate-500">${d.proveedor}</span>
            </td>
            <td class="px-6 py-3.5">
              ${BADGE[d.estado] || ''}
            </td>
            <td class="px-6 py-3.5 text-right">
              <button
                onclick="abrirDrawer('dominio', '${d.id}')"
                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium
                       text-blue-600 hover:text-blue-700 hover:bg-blue-50 border border-blue-200
                       hover:border-blue-300 transition-colors">
                Ver ficha
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="px-6 py-3 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
      <span class="text-xs text-slate-400">
        ${rows.length} de ${appData.dominios.length} dominios
      </span>
      <span class="text-xs text-slate-400">
        ${appData.dominios.filter(d => d.estado === 'migrado').length} migrados ·
        ${appData.dominios.filter(d => d.estado === 'pendiente').length} pendientes
      </span>
    </div>`;
}

// Tab de filtro reutilizable
function tabFiltro(stateKey, valor, label, count) {
  const activo = state[stateKey] === valor;
  return `
    <button
      onclick="setFiltro('${stateKey}', '${valor}')"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium
             border transition-colors
             ${activo
               ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
               : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}">
      ${label}
      <span class="text-[10px] font-bold px-1 py-0.5 rounded
                   ${activo ? 'bg-blue-500 text-white' : 'bg-slate-100 text-slate-500'}">
        ${count}
      </span>
    </button>`;
}

// Cambia un filtro y re-renderiza la sección correspondiente
function setFiltro(stateKey, valor) {
  state[stateKey] = valor;
  if (stateKey === 'dominiosFilter') {
    document.getElementById('content').innerHTML = renderDominios();
    document.getElementById('dominios-tbody').innerHTML = renderTablaDominios();
  }
  if (stateKey === 'websFilter') {
    document.getElementById('content').innerHTML = renderWebs();
    document.getElementById('webs-tbody').innerHTML = renderTablaWebs();
  }
}

function onBuscarDominios(valor) {
  state.dominiosBusqueda = valor;
  const el = document.getElementById('dominios-tbody');
  if (el) el.innerHTML = renderTablaDominios();
}

function abrirDrawer(tipo, id) {
  const entity = tipo === 'dominio'
    ? appData.dominios.find(d => d.id === id)
    : appData.webs.find(w => w.id === id);
  if (!entity) return;

  document.getElementById('drawer-content').innerHTML =
    tipo === 'dominio' ? drawerDominio(entity) : drawerWeb(entity);

  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrarDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer-panel').classList.remove('open');
  document.body.style.overflow = '';
}

            type="search"
            placeholder="Buscar sitio web…"
            value="${state.websBusqueda}"
            oninput="onBuscarWebs(this.value)"
            class="pl-9 pr-4 py-2 text-sm rounded-lg border border-slate-200 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400
                   w-60 transition-shadow placeholder-slate-400"
          />
        </div>
      </div>

      <!-- Tabla -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div id="webs-tbody"></div>
      </div>

    </div>`;
}

function renderTablaWebs() {
  let rows = appData.webs;

  if (state.websFilter === 'mig-fact')  rows = rows.filter(w => w.migracion === 'migrado'  && w.facturacion === 'facturado');
  if (state.websFilter === 'mig-pend')  rows = rows.filter(w => w.migracion === 'migrado'  && w.facturacion === 'pendiente');
  if (state.websFilter === 'pendiente') rows = rows.filter(w => w.migracion === 'pendiente');

  if (state.websBusqueda.trim()) {
    const q = state.websBusqueda.toLowerCase();
    rows = rows.filter(w =>
      w.nombre.toLowerCase().includes(q) ||
      w.proveedor.toLowerCase().includes(q) ||
      (w.url && w.url.toLowerCase().includes(q))
    );
  }

  if (!rows.length) {
    return `<div class="px-6 py-14 text-center text-sm text-slate-400">
              Sin resultados para los filtros aplicados.
            </div>`;
  }

  return `
    <table class="w-full">
      <thead>
        <tr class="border-b border-slate-100 bg-slate-50/80">
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Sitio web</th>
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider hidden lg:table-cell">Proveedor</th>
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Migración</th>
          <th class="text-left px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider hidden sm:table-cell">Facturación</th>
          <th class="text-right px-6 py-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        ${rows.map(w => {
          const tieneAlerta = !!w.alerta;
          const migBadge = w.migracion === 'migrado'
            ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">✓ Migrado</span>`
            : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">⏳ Pendiente</span>`;
          const factBadge = w.facturacion === 'facturado'
            ? BADGE.facturado
            : w.facturacion === 'pendiente'
            ? BADGE['pend-fact']
            : BADGE['no-facturado'];
          return `
            <tr class="hover:bg-slate-50/80 transition-colors group">
              <td class="px-6 py-3.5">
                <div class="flex items-start gap-2">
                  ${tieneAlerta
                    ? `<span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0" title="Alerta técnica activa"></span>`
                    : `<span class="mt-1.5 w-1.5 h-1.5 flex-shrink-0"></span>`}
                  <div class="min-w-0">
                    <p class="text-sm font-medium text-slate-800 group-hover:text-blue-700 transition-colors">
                      ${w.nombre}
                    </p>
                    ${w.url
                      ? `<p class="text-[11px] text-slate-400 font-mono mt-0.5 truncate">${w.url.replace(/^https?:\/\//, '')}</p>`
                      : `<p class="text-[11px] text-slate-300 mt-0.5 italic">Sin URL disponible</p>`}
                  </div>
                </div>
              </td>
              <td class="px-6 py-3.5 hidden lg:table-cell">
                <span class="text-sm text-slate-500">${w.proveedor}</span>
              </td>
              <td class="px-6 py-3.5">${migBadge}</td>
              <td class="px-6 py-3.5 hidden sm:table-cell">${factBadge}</td>
              <td class="px-6 py-3.5 text-right">
                <button
                  onclick="abrirDrawer('web', '${w.id}')"
                  class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium
                         text-blue-600 hover:text-blue-700 hover:bg-blue-50 border border-blue-200
                         hover:border-blue-300 transition-colors">
                  Ver ficha
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                  </svg>
                </button>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="px-6 py-3 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
      <span class="text-xs text-slate-400">
        ${rows.length} de ${appData.webs.length} sitios web
      </span>
      <span class="text-xs text-slate-400 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 inline-block"></span>
        Alerta técnica activa
      </span>
    </div>`;
}

function onBuscarWebs(valor) {
  state.websBusqueda = valor;
  const el = document.getElementById('webs-tbody');
  if (el) el.innerHTML = renderTablaWebs();
}

// ════════════════════════════════════════
// INICIALIZACIÓN
// ════════════════════════════════════════

function init() {
  // Listeners de navegación
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.section));
  });

  // Overlay del drawer cierra al hacer clic fuera
  document.getElementById('drawer-overlay').addEventListener('click', cerrarDrawer);

  // Cerrar drawer con Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') cerrarDrawer();
  });

  // Badge alertas críticas
  const criticos = appData.pendientes.filter(p => p.prioridad === 'critico').length;
  document.getElementById('badge-alertas').textContent = criticos;

  // Sección inicial
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
